name: Update RTB forms

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-rtb-forms
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/rtb-forms-update
      TITLE: "chore(data): sync RTB forms from official source"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run update:sources -- --summary "$RUNNER_TEMP/pr-body.md"
      - run: bun run validate
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No source changes."
            exit 0
          fi
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A data snapshots
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
