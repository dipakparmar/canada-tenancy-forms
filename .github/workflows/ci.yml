name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run check-links

  # Separate from `check` because this job downloads the PDFs from gov.bc.ca: a government
  # outage should not fail the catalog validation.
  maps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run fetch-forms
      - run: bun test
